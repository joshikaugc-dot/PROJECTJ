<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Feed | LinkedIn</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f2ee; margin: 0; padding: 24px; }
    .card { background: white; border-radius: 8px; padding: 16px; max-width: 560px; margin: 0 auto 16px; border: 1px solid #ddd; }
    .ql-editor { min-height: 90px; outline: none; border: 1px solid #ccc; border-radius: 6px; padding: 8px; }
  </style>
</head>
<body>
  <div class="card share-box">
    <div class="share-creation-state">
      <div class="ql-editor" id="composer" contenteditable="true" role="textbox" aria-label="Text editor for creating content"></div>
    </div>
  </div>
  <div class="card feed-shared-update-v2" data-urn="urn:li:activity:1">
    <div class="feed-shared-update-v2__description"><span>Recovery is the most underrated performance skill. Most people only track training.</span></div>
    <div class="comments-comment-box">
      <div class="ql-editor" id="comment" contenteditable="true" role="textbox" aria-label="Add a comment"></div>
    </div>
  </div>
</body>
</html>
